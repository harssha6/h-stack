<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Variant mocks</title>
<style>
:root{
  --bg:#0b0b0c;--surface:#131315;--raised:#1a1a1d;--hover:#222226;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --tx:#f2f2f3;--tx2:#a3a3aa;--tx3:#6b6b73;--acc:#ff4f8b;--acc-soft:rgba(255,79,139,.14);
  --ok:#43d39a;--warn:#f3b64b;--bad:#ff6b6b;--r:14px;--r-sm:9px;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --shadow:0 12px 32px -12px rgba(0,0,0,.6),0 0 0 1px var(--line2);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:13.5px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button,[role=button],select{cursor:pointer}
button{background:none;border:0;padding:0}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

/* header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:0 20px}
.titlebar{padding-top:14px;padding-bottom:4px;align-items:baseline;flex-wrap:wrap;row-gap:4px}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.meta{color:var(--tx3);font-size:12px}
.badge{font-size:11px;color:var(--tx2);border:1px solid var(--line2);border-radius:999px;padding:1px 8px}
.sp{flex:1}
.tabs{position:relative;display:flex;gap:4px;padding:0 20px;margin-top:6px}
.tab{position:relative;padding:9px 10px 11px;color:var(--tx2);font-weight:500;transition:color .15s ease}
.tab:hover,.tab[aria-selected=true]{color:var(--tx)}
.tab .n{color:var(--tx3);font-weight:400;margin-left:5px}
.tabline{position:absolute;bottom:-1px;left:0;height:2px;border-radius:2px;background:var(--tx);width:var(--w,0);transform:translateX(var(--x,0));transition:transform .24s var(--ease-out),width .24s var(--ease-out);will-change:transform}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 20px;flex-wrap:wrap}
.seg{position:relative;display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px;isolation:isolate}
.seg button{position:relative;z-index:1;height:28px;padding:0 11px;border-radius:8px;color:var(--tx2);white-space:nowrap;font-weight:500;transition:color .15s ease,transform .12s var(--ease-out)}
.seg button:hover,.seg button[aria-pressed=true]{color:var(--tx)}
.seg .thumb{position:absolute;z-index:0;top:2px;bottom:2px;left:2px;border-radius:8px;background:var(--hover);box-shadow:0 0 0 1px var(--line2),0 1px 2px rgba(0,0,0,.4);width:var(--w,0);transform:translateX(var(--x,0));transition:transform .22s var(--ease-out),width .22s var(--ease-out);will-change:transform}
.seg.icons button{width:32px;padding:0;display:grid;place-items:center}
.btn{height:32px;display:inline-flex;align-items:center;gap:7px;padding:0 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--tx);font-weight:500;white-space:nowrap;transition:background-color .15s ease,border-color .15s ease,transform .12s var(--ease-out)}
.btn:hover{background:var(--raised);border-color:var(--line2)}
.btn:active,.seg button:active,.icon:active{transform:scale(.97)}
.btn .k{color:var(--tx3);font-weight:400}
.btn.on{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.btn.primary{background:var(--tx);color:var(--bg);border-color:transparent}
.icon{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--tx2);flex-shrink:0;transition:background-color .15s ease,color .15s ease,transform .12s var(--ease-out)}
.icon:hover{background:var(--raised);color:var(--tx)}
.chev{opacity:.6}
.pop-wrap{position:relative}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:300px;background:var(--raised);border-radius:12px;box-shadow:var(--shadow);padding:6px;transform-origin:top left;opacity:0;transform:scale(.97) translateY(-2px);pointer-events:none;transition:opacity .15s var(--ease-out),transform .15s var(--ease-out)}
.pop.right{left:auto;right:0;transform-origin:top right}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop h6{margin:8px 8px 4px;font-size:11px;font-weight:500;color:var(--tx3)}
.opt{width:100%;display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;text-align:left;transition:background-color .12s ease}
.opt:hover{background:var(--hover)}
.opt .c{margin-left:auto;padding-left:16px;white-space:nowrap;color:var(--tx3);font-size:12px}
.opt .tick{width:16px;color:var(--acc);flex-shrink:0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;padding:8px;font-size:12.5px;color:var(--tx2);white-space:nowrap}
kbd{font:500 11px ui-monospace,Menlo,monospace;color:var(--tx);background:var(--surface);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;margin-right:2px}

/* main */
main{padding:16px 20px 64px}
.note-bar{display:flex;gap:10px;align-items:flex-start;color:var(--tx2);font-size:12.5px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);margin-bottom:16px}
.note-bar i{width:6px;height:6px;border-radius:50%;background:var(--ok);margin-top:6px;flex-shrink:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.note-bar b{color:var(--tx);font-weight:600}
.grid{display:grid;gap:14px;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
.card{position:relative;container-type:inline-size;background:var(--surface);border-radius:var(--r);box-shadow:0 0 0 1px var(--line);overflow:hidden;transition:box-shadow .18s ease}
.card:hover{box-shadow:0 0 0 1px var(--line2)}
.card.picked{box-shadow:0 0 0 1.5px var(--acc)}
.chead{display:flex;align-items:center;gap:9px;padding:9px 6px 9px 12px}
.tag{flex-shrink:0;display:inline-block;font-weight:600;font-size:11.5px;line-height:1;color:var(--tx);background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);border-radius:6px;padding:4px 6px;white-space:nowrap}
.picked .tag{background:var(--acc);box-shadow:none;color:#fff}
.ttl{min-width:0;flex:1}
.ttl .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .ds{color:var(--tx3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{color:var(--tx3)}
.picked .star{color:var(--acc)}
.shot{position:relative;display:block;width:100%;background:#000;cursor:zoom-in}
.shot img{display:block;width:100%;height:auto}
.fallback{position:absolute;right:6px;top:6px;max-width:calc(100% - 12px);font-size:10.5px;line-height:1.5;color:#ddd;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);border-radius:6px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfoot{display:flex;align-items:center;gap:12px;padding:9px 12px 10px}
.bars{display:flex;gap:8px;flex:1;min-width:0}
.bar{flex:1;min-width:0}
.bar .l{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);gap:4px}
.bar .l span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .l span:last-child{color:var(--tx2)}
.bar .ab2{display:none}
@container (max-width:340px){.bar .full{display:none}.bar .ab2{display:inline}.bar .l{flex-direction:column;gap:0;line-height:1.3}.mean{font-size:16px}.cfoot{gap:10px;padding:8px 10px 9px}.bars{gap:6px}}
.track{height:3px;border-radius:2px;background:var(--hover);margin-top:4px;overflow:hidden}
.track i{display:block;height:100%;border-radius:2px;transform-origin:left}
.mean{font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1;text-align:right}
.mean small{display:block;font-size:10.5px;font-weight:400;color:var(--tx3);letter-spacing:0;margin-top:3px}
.noteb{display:flex;align-items:center;gap:7px;width:100%;padding:8px 12px;border-top:1px solid var(--line);color:var(--tx3);font-size:12.5px;text-align:left;transition:color .15s ease,background-color .15s ease}
.noteb:hover{color:var(--tx2);background:var(--raised)}
.noteb.has{color:var(--tx2)}
.noteb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
textarea.note{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--bg);padding:9px 12px;resize:vertical;min-height:64px;color:var(--tx);outline:none}
.empty{color:var(--tx3);padding:48px 12px;text-align:center}
/* rows: one variant per line, captions aligned for scanning */
.rows{display:flex;flex-direction:column}
.vrow{display:grid;grid-template-columns:var(--metaw,168px) minmax(0,1fr);gap:16px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vmeta{display:flex;gap:9px;align-items:flex-start;min-width:0}
.vmeta .tx{min-width:0;flex:1}
.vmeta .nm{font-weight:600;line-height:1.3}
.vmeta .ds{color:var(--tx3);font-size:12px;line-height:1.35;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vmeta .fb{color:var(--warn);font-size:11.5px;margin-top:3px}
.vmeta .sc{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2);margin-top:4px}
.vmeta .sc i{width:6px;height:6px;border-radius:50%}
.vrow .shot{border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line);max-width:var(--rowmax,820px)}
.ghost{opacity:0;transition:opacity .15s ease}
.vrow:hover .ghost,.gcard:hover .ghost,.ghost[aria-pressed=true],.ghost:focus-visible{opacity:1}
.picked .tag{background:var(--acc);box-shadow:none;color:#fff}
/* grid: image first, one quiet label line */
.gcard{position:relative;min-width:0}
.gcard .shot{border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.gcard.picked .shot{box-shadow:0 0 0 1.5px var(--acc)}
.glab{display:flex;align-items:center;gap:8px;padding:7px 2px 0;min-width:0}
.glab .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.glab .fb{color:var(--warn);font-size:11px;white-space:nowrap}
.glab .icon{width:26px;height:26px;margin:-4px -4px -4px 0}
.lbnote{width:100%;max-width:720px;margin:0 auto 14px;display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;resize:vertical;min-height:38px;color:var(--tx);outline:none}
.lbnote:focus{border-color:var(--line2)}
@media (max-width:760px){.vrow{grid-template-columns:1fr;gap:6px}}

/* focus: lightbox standalone, inline panel in T3 */
.lb{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:rgba(6,6,7,.9);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .2s var(--ease-out)}
.lb.open{opacity:1;pointer-events:auto}
.lb .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 68px 12px;overflow:auto;transform:scale(.985);transition:transform .2s var(--ease-out)}
.lb.open .stage{transform:none}
.lb .stage img{max-width:100%;max-height:var(--fh,860px);border-radius:10px;box-shadow:0 0 0 1px var(--line2)}
.lb.real .stage{align-items:flex-start;justify-content:flex-start}
.lb.real .stage img{max-width:none;max-height:none}
.lbbar{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.lbnav{position:absolute;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:999px;display:grid;place-items:center;background:var(--raised);box-shadow:var(--shadow);color:var(--tx);transition:transform .12s var(--ease-out)}
.lbnav:active{transform:scale(.94)}
.lbnav.prev{left:14px}.lbnav.next{right:14px}

/* compare */
.cmp-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.sel{position:relative;min-width:0}
.sel select{appearance:none;-webkit-appearance:none;height:32px;padding:0 30px 0 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--tx);max-width:330px}
.sel select:hover{border-color:var(--line2)}
.sel svg{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--tx3)}
.ab{font-size:11px;font-weight:600;color:var(--tx3)}
.side{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 auto;max-width:var(--cmpw2,none)}
.side figure{margin:0;border-radius:var(--r);overflow:hidden;box-shadow:0 0 0 1px var(--line);background:#000}
.side img{display:block;width:100%}
.side figcaption{padding:8px 12px;color:var(--tx2);font-size:12px;background:var(--surface)}
.swipe{position:relative;margin:0 auto;max-width:var(--cmpw,none);border-radius:var(--r);overflow:hidden;box-shadow:0 0 0 1px var(--line);background:#000;user-select:none;touch-action:none;cursor:ew-resize}
.swipe.blink{cursor:pointer}
.swipe img{display:block;width:100%;pointer-events:none}
.swipe .a{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--p,50%)) 0 0)}
.swipe.blink .a{clip-path:none}
.swipe .h{position:absolute;top:0;bottom:0;left:var(--p,50%);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.swipe .h i{position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px;border-radius:999px;background:#fff;color:#000;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.lab{position:absolute;top:10px;font-size:11.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.66);backdrop-filter:blur(6px);border-radius:6px;padding:2px 8px}
.lab.l{left:10px}.lab.r{right:10px}
.hint{color:var(--tx3);font-size:12px;margin:10px 0 0}

/* scores */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border-radius:var(--r);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-weight:500;color:var(--tx3);font-size:12px;white-space:nowrap}
.tbl th button{color:inherit;display:inline-flex;gap:4px;align-items:center}
.tbl th button:hover,.tbl th.on{color:var(--tx)}
.tbl td.n{white-space:nowrap;min-width:84px}
.tbl tbody tr:hover td{background:var(--raised)}
.tbl td:first-child{white-space:nowrap}
.verd{color:var(--tx2);font-size:12px;line-height:1.45;min-width:240px}
.verd p{margin:0 0 4px}
.verd b{color:var(--tx3);font-weight:500}
.cap{color:var(--tx3);font-size:12px;margin:0 0 12px}
.tblwrap{overflow-x:auto}

/* refs, picks */
.refs{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.ref{border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:0 0 0 1px var(--line);transition:box-shadow .18s ease}
.ref:hover{box-shadow:0 0 0 1px var(--line2)}
.ref img{display:block;width:100%;cursor:zoom-in}
.ref .rt{padding:9px 11px 11px}
.ref .ap{font-weight:600}
.ref .pt{color:var(--tx3);font-size:12px;margin:1px 0 6px}
.ref a{color:var(--tx2);font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.ref a:hover{color:var(--tx)}
.md{white-space:pre-wrap;background:var(--surface);box-shadow:0 0 0 1px var(--line);border-radius:var(--r);padding:14px;color:var(--tx2);font:12.5px/1.6 ui-monospace,Menlo,monospace;margin-top:12px}
.toast{position:fixed;left:50%;bottom:20px;z-index:80;background:var(--raised);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-size:12.5px;opacity:0;transform:translate(-50%,6px);transition:opacity .18s var(--ease-out),transform .18s var(--ease-out);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* T3 embed: theme variables, no page background, no viewport units */
html.embed,body.embed{background:transparent}
body.embed{--bg:var(--background);--surface:var(--card);--raised:var(--secondary);--hover:color-mix(in srgb,var(--foreground) 9%,transparent);--line:color-mix(in srgb,var(--border) 70%,transparent);--line2:var(--border);--tx:var(--foreground);--tx2:var(--muted-foreground);--tx3:color-mix(in srgb,var(--muted-foreground) 72%,transparent);--acc:var(--primary);--acc-soft:color-mix(in srgb,var(--primary) 16%,transparent);--ok:var(--success);--warn:var(--warning);--bad:var(--destructive);--r:var(--radius)}
body.embed .top{position:static;background:transparent;backdrop-filter:none}
body.embed .row,body.embed .tabs,body.embed .toolbar{padding-left:0;padding-right:0}
body.embed main{padding:14px 0 8px}
body.embed .lb{position:relative;inset:auto;display:none;background:var(--surface);border-radius:var(--r);box-shadow:0 0 0 1px var(--line);margin-bottom:14px;backdrop-filter:none}
body.embed .lb.open{display:flex}
body.embed .lb .stage{padding:4px 60px 16px}
body.embed .lb .stage img{max-height:1300px}
body.embed .kbdbtn{display:none}

@media (max-width:760px){body:not(.embed) .side{grid-template-columns:1fr}body:not(.embed) .grid{--cols:1!important}body:not(.embed) .top{position:static}body:not(.embed) .seg.icons,body:not(.embed) .kbdbtn,body:not(.embed) .titlebar .meta{display:none}.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}main{padding:12px 14px 48px}.row,.tabs,.toolbar{padding-left:14px;padding-right:14px}.lb .stage{padding:8px 12px 16px}.lbnav{display:none}}
@media (prefers-reduced-motion:reduce){.ghost,.tabline,.seg .thumb,.pop,.lb,.lb .stage,.btn,.icon,.toast,.card,.tab,.seg button,.opt,.ref,.noteb{transition:none}.btn:active,.seg button:active,.icon:active,.lbnav:active{transform:none}}
</style>
</head>
<body>
<div class="top">
  <div class="row titlebar"><h1 id="title"></h1><span class="meta" id="subtitle"></span><span class="sp"></span><span class="badge" id="stamp"></span></div>
  <div class="tabs" id="tabs" role="tablist"><span class="tabline" id="tabline"></span></div>
  <div class="toolbar" id="toolbar"></div>
</div>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>

const I = {

  starF: '<path fill="currentColor" d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/>',

    h('button', { class: 'btn primary', on: { click: () => (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copied as markdown'), () => toast('Clipboard is blocked here. Select the text below.')) } }, 'Copy as markdown'),
    h('button', { class: 'btn', on: { click: () => { const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify({ id: M.id, picks: st.picks, notes: st.notes }, null, 2)], { type: 'application/json' })), download: (M.id || 'picks') + '-picks.json' }); a.click() } } }, 'Download JSON'),
    h('span', { class: 'sp' }),
    h('button', { class: 'btn', on: { click: () => { if (confirm('Clear all picks and notes?')) { st.picks = {}; st.notes = {}; save(); renderAll() } } } }, 'Clear')),
    h('div', { class: 'md' }, txt));
}

/* render */
function renderMain() {
  const m = $('#main'); m.replaceChildren();
  if (M.decision && (st.tab === 'variants' || st.tab === 'compare')) m.append(h('div', { class: 'note-bar' }, h('i'), h('div', { html: M.decision })));
  m.append({ variants: variantsView, compare: compareView, scores: scoresView, refs: refsView, picks: picksView }[st.tab]());
}
function renderAll() {
  $('#title').textContent = M.title || 'Variants'; $('#subtitle').textContent = M.subtitle || ''; $('#stamp').textContent = M.stamp || 'Proposal'; document.title = M.title || 'Variants';
  renderTabs(); renderToolbar(); renderMain();
}
addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.activeElement.classList.contains('lbnote')) { document.activeElement.blur(); return }
  if (['TEXTAREA', 'INPUT', 'SELECT'].includes(document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') { if (openPop) return closePop(); return closeFocus() }
  if (/^[1-9]$/.test(e.key) && VIEWS[+e.key - 1] && (st.tab === 'variants' || st.tab === 'compare')) { st.view = VIEWS[+e.key - 1].key; save(); renderToolbar(); if (st.fidx >= 0) refreshFocus(); else renderMain(); return }
  if (st.fidx < 0 || st.tab !== 'variants') return;
  const k = e.key.toLowerCase();
  if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { const i = STATES.indexOf(st.state); st.state = STATES[(i + (e.key === 'ArrowDown' ? 1 : -1) + STATES.length) % STATES.length]; save(); renderToolbar(); refreshFocus() }
  else if (k === 'z') { st.real = !st.real; refreshFocus() }
  else if (k === 'p') togglePick(V[st.fidx].id);
  else return;
  e.preventDefault();
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { document.querySelectorAll('.seg').forEach(s => moveThumb(s, true)); renderTabs() }, 80) });
renderAll();
</script>
